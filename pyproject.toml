[project]
name = "turbogrant-twin-sfc"
version = "0.1.0"
description = "Live/demo temperature monitor for a sensor-instrumented physical model"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.14"
authors = [
  {name = "Damian Janiga", email = "janiga@agh.edu.pl"},
]

dependencies = [
    "PySide6>=6.7",
    "pyqtgraph>=0.13.4",
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "pyserial>=3.5",
    "PyYAML>=6.0",
    "pydantic>=2.13.4",
]

[tool.uv]
package = false
